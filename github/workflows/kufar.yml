name: kufar-monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # раз в 5 минут (чаще GitHub не позволяет)
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write            # чтобы сохранять seen.json обратно в репозиторий

concurrency:
  group: kufar-monitor
  cancel-in-progress: false  # запуски не накладываются друг на друга

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить Куфар и отправить новые объявления
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python kufar_bot.py --once

      - name: Сохранить список просмотренных объявлений
        run: |
          git config user.name "kufar-bot"
          git config user.email "kufar-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
