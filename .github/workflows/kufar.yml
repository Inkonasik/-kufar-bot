name: kufar-monitor

on:
  workflow_dispatch:   # запуск раз в 5 минут делает cron-job.org (и кнопка «Run workflow» вручную).
                       # Расписание — ТОЛЬКО там: не добавляй сюда schedule, иначе будет два источника запусков.
    inputs:
      dry_run:
        description: "Тестовый запуск: ничего не отправлять и не сохранять, только показать в логе, что ушло бы и почему"
        type: boolean
        default: false   # cron-job.org флажок не передаёт — его запуски всегда обычные

permissions:
  contents: write      # чтобы сохранять seen.json и market_history.json обратно в репозиторий

concurrency:
  group: kufar-monitor
  cancel-in-progress: false   # идущий запуск не прерываем; если запуски копятся, в очереди остаётся только самый новый

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # зависший запуск не блокирует следующие дольше 10 минут

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v7
        with:
          # Свежая вершина main в момент старта, а не коммит на момент вызова. Без этого запуск, который ждал в очереди
          # (concurrency), начинал бы со снимка seen.json и базы ДО коммита предыдущего запуска.
          ref: main

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip          # requests не скачивается каждый раз: запуск стартует быстрее, свежие объявления успевают уйти

      - name: Установить зависимости
        timeout-minutes: 3
        run: python -m pip install -r requirements.txt

      - name: Проверить Куфар и отправить новые объявления
        timeout-minutes: 6
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Необязательные настройки оценки перепродажи: Settings → Secrets and variables → Actions → Variables.
          # Если переменной нет, значение пустое и бот берёт настройку по умолчанию.
          HOME_REGION: ${{ vars.HOME_REGION }}
          REPAIR_COSTS: ${{ vars.REPAIR_COSTS }}
          EXTRA_COSTS_BYN: ${{ vars.EXTRA_COSTS_BYN }}
          MIN_PROFIT_BYN: ${{ vars.MIN_PROFIT_BYN }}
          FRESH_MAX_AGE_S: ${{ vars.FRESH_MAX_AGE_S }}   # пусто = 300 с (5 минут)
          DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
        run: python kufar_bot.py --once

      # always(): даже если шаг выше упал или завершился по таймауту, уже обработанные объявления сохраняются
      # (бот пишет seen.json и базу после каждого отправленного сообщения), и они не придут повторно.
      # Файлы состояния — в одном коммите. Бот пишет их атомарно (временный файл + замена), так что обрыв не оставит половину файла.
      # В тестовом запуске (dry_run) шаг не выполняется вовсе: живое состояние не меняется.
      - name: Сохранить состояние и базу рынка
        if: always() && !inputs.dry_run
        timeout-minutes: 3
        run: |
          git config user.name "kufar-bot"
          git config user.email "kufar-bot@users.noreply.github.com"

          STATE_FILES="seen.json market_history.json market_history.backup.json"
          FILES=""
          for f in $STATE_FILES; do
            if [ -f "$f" ]; then FILES="$FILES $f"; fi
          done
          if [ -z "$FILES" ]; then
            echo "Файлов состояния нет (бот не успел их создать) — сохранять нечего."
            exit 0
          fi

          git add -- $FILES
          if git diff --cached --quiet; then
            echo "Изменений в состоянии нет."
            exit 0
          fi
          git commit -q -m "update seen and market history"

          # Push не прошёл — значит, в main появился более новый коммит (твоя правка или состояние другого запуска).
          # Тогда НЕ перезаписываем одну версию другой: берём свежий main и сливаем состояние по смыслу
          # (kufar_bot.py --merge-state: отправленные объявления, метки и записи базы остаются от обеих версий).
          # Слияние делает копия бота ЭТОГО запуска — файлы рядом с ней и есть «наше» состояние.
          OURS="${RUNNER_TEMP:-/tmp}/kufar_ours"
          rm -rf "$OURS"
          mkdir -p "$OURS"
          cp kufar_bot.py "$OURS/"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push не прошёл (попытка $attempt из 5). Беру свежий main и сливаю состояние."
            sleep $((attempt * 3))
            git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main || continue
            for f in $STATE_FILES; do
              if [ -f "$f" ]; then cp "$f" "$OURS/"; fi
            done
            git reset -q --hard origin/main
            if python "$OURS/kufar_bot.py" --merge-state "$PWD"; then
              echo "Состояние этого запуска слито с версией из main."
            else
              echo "Слить не удалось — сохраняю состояние этого запуска как есть."
            fi
            for f in $STATE_FILES; do
              if [ -f "$OURS/$f" ]; then cp "$OURS/$f" "$f"; git add -- "$f"; fi
            done
            if git diff --cached --quiet; then
              echo "После слияния сохранять нечего: в main уже то же самое."
              exit 0
            fi
            git commit -q -m "update seen and market history (merged)"
          done

          echo "Не удалось сохранить состояние. Следующий запуск начнёт с прошлой версии; повторов не будет:"
          echo "объявления старше 5 минут бот не отправляет никогда."
          exit 1
