name: kufar-monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kufar-monitor
  queue: single
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v7

      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: python -m pip install -r requirements.txt

      - name: Проверить Куфар и отправить новые объявления
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python kufar_bot.py --once

      - name: Сохранить список просмотренных объявлений
        run: |
          git config user.name "kufar-bot"
          git config user.email "kufar-bot@users.noreply.github.com"

          if [ ! -f seen.json ]; then
            echo "Ошибка: файл seen.json не найден."
            exit 1
          fi

          git add -- seen.json

          if git diff --cached --quiet; then
            echo "Изменений в seen.json нет."
            exit 0
          fi

          git commit -m "update seen"
          git push origin HEAD:main
